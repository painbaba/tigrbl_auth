[project]
name = "tba-concrete-claim-authorization-context"
version = "0.4.0.dev2"
description = "Standalone draft authorization context (actx) claim implementation."
requires-python = ">=3.10,<3.15"
dependencies = [
    "tba-primitives-identity==0.4.0.dev2",
    "tba-bases-claim==0.4.0.dev2",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_concrete_claim_authorization_context", from = "src" }]
