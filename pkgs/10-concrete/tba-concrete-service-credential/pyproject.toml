[project]
name="tba-concrete-service-credential"
version="0.4.0.dev2"
description = "Concrete service credential value types for Tigrbl Auth."
license = { text = "Apache-2.0" }
requires-python=">=3.10,<3.16"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies=["tba-contracts-identity==0.4.0.dev2","tba-bases-authentication-credential==0.4.0.dev2"]
[build-system]
requires=["poetry-core>=1.0.0"]
build-backend="poetry.core.masonry.api"
[tool.poetry]
packages=[{include="tba_concrete_service_credential",from="src"}]
