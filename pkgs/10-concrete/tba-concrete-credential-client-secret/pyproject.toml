[project]
name="tba-concrete-credential-client-secret"
version="0.4.0.dev2"
description = "Concrete credential client secret value types for Tigrbl Auth."
requires-python=">=3.10,<3.16"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
license="Apache-2.0"
dependencies=["tba-contracts-identity==0.4.0.dev2","tba-bases-authentication-credential==0.4.0.dev2"]
[build-system]
requires=["poetry-core>=1.0.0"]
build-backend="poetry.core.masonry.api"
[tool.poetry]
packages=[{include="tba_concrete_credential_client_secret",from="src"}]
