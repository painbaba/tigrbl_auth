[project]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
readme = "README.md"
name = "tba-bases-identity-authenticator"
version = "0.1.1.dev1"
description = "Deprecated compatibility facade; use tba-bases-authenticator instead."
requires-python = ">=3.10,<3.16"
license = "Apache-2.0"
dependencies = ["tba-bases-authenticator==0.1.0"]
[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
[tool.poetry]
packages = [{ include = "tba_bases_identity_authenticator", from = "src" }]
