[project]
name = "tigrbl-oidc-bases"
version = "0.4.0.dev2"
license = { text = "Apache-2.0" }
description = "Deprecated facade for neutral identity and assurance bases."
requires-python = ">=3.10,<3.16"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "tigrbl-authentication-assurance-bases==0.4.0.dev2",
    "tigrbl-identity-claims-bases==0.4.0.dev2",
    "tigrbl-identity-model-bases==0.4.0.dev2",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tigrbl_oidc_bases", from = "src" }]
