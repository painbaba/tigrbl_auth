[project]
name = "tba-durability-key-material"
version = "0.4.0.dev2"
description = "Durable crypto-key table hooks and specifications."
readme = "README.md"
requires-python = ">=3.10,<3.16"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
license = "Apache-2.0"
dependencies = [
    "tigrbl==0.4.5.dev8",
    "tigrbl==0.4.5.dev8",
    "tba-contracts-security-trust==0.1.0",
    "tba-storage-key-material==0.4.0.dev3",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_durability_key_material", from = "src" }]
