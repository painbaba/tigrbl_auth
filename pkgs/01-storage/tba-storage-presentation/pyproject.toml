[project]
name = "tba-storage-presentation"
version = "0.4.0.dev2"
description = "Owned presentation identity database tables and migrations."
readme = "README.md"
requires-python = ">=3.10,<3.16"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
license = { text = "Apache-2.0" }
dependencies = [
    "tigrbl>=0.4.4.dev1,<0.5",
    "tigrbl-migrations>=0.4.5.dev4",
    "tba-primitives-identity[storage]>=0.4.0.dev2",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_storage_presentation", from = "src" }]
include = ["src/tba_storage_presentation/component.toml"]
