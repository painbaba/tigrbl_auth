[project]
name = "tba-protocol-bimi"
version = "0.4.0.dev2"
description = "BIMI TXT record parsing and selector discovery."
readme = "README.md"
requires-python = ">=3.10,<3.16"
license = "Apache-2.0"
dependencies = [
    "defusedxml==0.7.1",
    "tba-codec-x509-logotype==0.4.0.dev2",
    "tba-contracts-dns==0.4.0.dev2",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tba_protocol_bimi", from = "src" }]
